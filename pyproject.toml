[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "revenue-recovery"
version = "0.1.0"
description = "AI Revenue Recovery Agent"
requires-python = ">=3.12"
license = {text = "MIT"}

[dependencies]
fastapi = ">=0.110.0"
uvicorn = ">=0.27.0"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.2.0"
sqlalchemy = ">=2.0.0"
psycopg = { version = ">=3.2.0", extras = ["binary"] }
httpx = ">=0.27.0"
pytest = ">=8.2.0"
ruff = ">=0.8.0"

[tool.ruff]
line-length = 88
exclude = [".git", "*.egg-info", ".ruff_cache", "htmlcov", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest assertions are the standard mechanism in test code;
# subprocess is required by the DATABASE_URL fail-fast test.
"tests/*" = ["S101", "S603"]